<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Superhog57 Arcade</title>

<style>
html{
scroll-behavior:smooth;
}

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#0d0d0d;
color:white;
}

header{
background:linear-gradient(135deg,#ff0040,#ff7b00);
text-align:center;
padding:40px 20px;
animation:glow 3s infinite alternate;
}

@keyframes glow{
from{box-shadow:0 0 15px #ff0040;}
to{box-shadow:0 0 40px #ff7b00;}
}

header h1{
margin:0;
font-size:48px;
}

nav{
position:sticky;
top:0;
background:#111;
padding:12px;
text-align:center;
z-index:1000;
}

nav a{
text-decoration:none;
color:#ff7b00;
font-size:18px;
font-weight:bold;
margin:0 10px;
}

nav a:hover{
color:white;
}

section{
max-width:1100px;
margin:auto;
padding:35px 20px;
}

h2{
border-bottom:2px solid #333;
padding-bottom:10px;
}

.gameGrid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-top:20px;
}

.gameBtn{
display:block;
width:100%;
background:#1c1c1c;
border:none;
border-radius:15px;
padding:25px;
text-align:center;
font-size:22px;
font-weight:bold;
color:#ff7b00;
text-decoration:none;
cursor:pointer;
transition:.25s;
}

.gameBtn:hover{
transform:scale(1.05);
background:#292929;
}

#output{
margin-top:30px;
font-size:30px;
text-align:center;
color:#ffd000;
min-height:80px;
}

#clock{
font-size:60px;
text-align:center;
font-weight:bold;
text-shadow:
0 0 10px #ff7b00,
0 0 25px #ff0040;
}

#date{
text-align:center;
font-size:24px;
color:#ff7b00;
margin-top:10px;
}

footer{
background:#111;
text-align:center;
padding:20px;
margin-top:30px;
color:#999;
}

@media(max-width:600px){

header h1{
font-size:34px;
}

#clock{
font-size:40px;
}

#date{
font-size:18px;
}

.gameBtn{
font-size:18px;
padding:20px;
}
}
</style>
</head>

<body>

<header>
<h1>Superhog57 Arcade</h1>
<p>Games • Doodles • Fun Projects</p>
</header>

<nav>
<a href="#games">Games</a>
<a href="#clockArea">Clock</a>
</nav>

<section id="games">

<h2>Google Games</h2>

<div class="gameGrid">

<a class="gameBtn"
href="https://www.google.com/doodles"
target="_blank">
🎮 Doodles Archive
</a>

<a class="gameBtn"
href="https://www.google.com/fbx?fbx=snake"
target="_blank">
🐍 Google Snake
</a>

<a class="gameBtn"
href="https://www.google.com/fbx?fbx=blockbreaker"
target="_blank">
🧱 Block Breaker
</a>

</div>

<h2 style="margin-top:50px;">
Built-In Arcade Games
</h2>

<div class="gameGrid">

<button class="gameBtn" onclick="coinFlip()">
🪙 Coin Flip
</button>

<button class="gameBtn" onclick="rollDice()">
🎲 Roll Dice
</button>

<button class="gameBtn" onclick="guessNumber()">
🔢 Number Guesser
</button>

<button class="gameBtn" onclick="startReaction()">
⚡ Reaction Test
</button>

<button class="gameBtn" onclick="rockPaperScissors()">
✊ Rock Paper Scissors
</button>

<button class="gameBtn" onclick="changeColor()">
🎨 Random Color
</button>

</div>

<div style="text-align:center;margin-top:40px;">

<h3>🎯 Click Challenge</h3>

<button class="gameBtn"
onclick="clickScore()"
style="max-width:300px;margin:auto;">
Click Me!
</button>

<p id="clicks">Clicks: 0</p>

</div>

<div id="output">
Ready to play!
</div>

</section>

<section id="clockArea">

<h2>Clock & Date</h2>

<div id="clock"></div>
<div id="date"></div>

</section>

<footer>
© Superhog57 Arcade
</footer>

<script>

let clickCount=0;

function clickScore(){
clickCount++;
document.getElementById("clicks").textContent=
"Clicks: "+clickCount;
}

function coinFlip(){
const result=Math.random()<0.5?"Heads":"Tails";
document.getElementById("output").textContent=
"🪙 "+result;
}

function rollDice(){
const roll=Math.floor(Math.random()*6)+1;
document.getElementById("output").textContent=
"🎲 You rolled "+roll;
}

function guessNumber(){

const answer=Math.floor(Math.random()*10)+1;

const guess=prompt(
"Guess a number from 1 to 10"
);

if(Number(guess)===answer){

document.getElementById("output").textContent=
"✅ Correct!";

}
else{

document.getElementById("output").textContent=
"❌ Wrong! Number was "+answer;

}
}

let reactionStart=0;

function startReaction(){

document.getElementById("output").textContent=
"Wait...";

const wait=Math.random()*3000+1000;

setTimeout(()=>{

document.getElementById("output").innerHTML=
`<button class="gameBtn"
onclick="stopReaction()">
CLICK NOW!
</button>`;

reactionStart=Date.now();

},wait);
}

function stopReaction(){

const reaction=
Date.now()-reactionStart;

document.getElementById("output").textContent=
"⚡ "+reaction+" ms";

}

function rockPaperScissors(){

const options=["Rock","Paper","Scissors"];

const cpu=
options[Math.floor(Math.random()*3)];

const player=
prompt("Rock, Paper, or Scissors?");

if(!player)return;

document.getElementById("output").textContent=
"✊ You: "+player+
" | CPU: "+cpu;

}

function changeColor(){

const color=
"#"+Math.floor(Math.random()*16777215)
.toString(16);

document.body.style.background=color;

document.getElementById("output").textContent=
"🎨 Color: "+color;

}

function updateClock(){

const now=new Date();

let h=now.getHours();
let m=now.getMinutes();
let s=now.getSeconds();

const ampm=h>=12?"PM":"AM";

h=h%12||12;

h=String(h).padStart(2,"0");
m=String(m).padStart(2,"0");
s=String(s).padStart(2,"0");

document.getElementById("clock").textContent=
`${h}:${m}:${s} ${ampm}`;

document.getElementById("date").textContent=
now.toLocaleDateString(undefined,{
weekday:"long",
month:"long",
day:"numeric",
year:"numeric"
});

}

updateClock();
setInterval(updateClock,1000);

</script>

</body>
</html>
